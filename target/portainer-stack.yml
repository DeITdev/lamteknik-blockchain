services:
  mysql:
    image: mysql:8.0
    container_name: lamteknik-webapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: lamtek_db
      MYSQL_USER: lamtek
      MYSQL_PASSWORD: lamtek123
    command: >
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --default-storage-engine=InnoDB
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app

  redis:
    image: redis:7-alpine
    container_name: lamteknik-webapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  backend:
    image: lamteknik-webapp-backend:local
    pull_policy: never
    container_name: lamteknik-webapp-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      TYPEORM_SYNCHRONIZE: "false"
      SEED_ON_STARTUP: "true"
      LOAD_SQL_SEEDS: "false"
      DATABASE_URL: mysql://lamtek:lamtek123@mysql:3306/lamtek_db
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: lamtek
      DB_PASSWORD: lamtek123
      DB_DATABASE: lamtek_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: lamtek-secret-key-2025
      JWT_EXPIRES_IN: 24h
      CORS_ORIGINS: "localhost,http://localhost:3002,http://10.9.23.41:3002"
      BLOCKCHAIN_ENABLED: "false"
      BESU_RPC_URL: http://10.9.23.40:8545
      BESU_WS_URL: ws://10.9.23.40:8546
      IPFS_API_URL: http://10.9.23.40:5001
      IPFS_GATEWAY_URL: http://10.9.23.40:8080
      DATA_FILE_WORKFLOW_MODE: sync
      SIGNER_MODE: external
    ports:
      - "3001:3000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app

  frontend:
    image: lamteknik-webapp-frontend:local
    pull_policy: never
    container_name: lamteknik-webapp-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: http://backend:3000
    ports:
      - "3002:3002"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

networks:
  app:
    name: lamteknik-webapp
    driver: bridge

volumes:
  mysql-data:
    external: true
    name: target_lamteknik-mysql-data
